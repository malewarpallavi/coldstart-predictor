server:
  port: ${PORT:8080}
predictor:
  collection: invocations
  window-minutes: ${WINDOW_MINUTES:15}
  alpha: ${ALPHA:0.5}                       # smoothing factor, 0..1 (higher = reacts faster)
  spike-threshold-rpm: ${SPIKE_THRESHOLD_RPM:5}   # forecast req/min above which we pre-warm
  requests-per-instance-per-minute: ${RPM_PER_INSTANCE:600}
  max-min-instances: ${MAX_MIN_INSTANCES:3}
  gcp-project: ${GCP_PROJECT:}
  region: ${REGION:us-central1}
  target-service: ${TARGET_SERVICE:coldstart-service}
  dry-run: ${DRY_RUN:true}                  # log decisions without touching Cloud Run
