AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  InvocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: fn,     AttributeType: S }
        - { AttributeName: ts_min, AttributeType: N }
      KeySchema:
        - { AttributeName: fn,     KeyType: HASH }
        - { AttributeName: ts_min, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  TargetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: service/
      Handler: app.handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 10
      AutoPublishAlias: live
      Environment:
        Variables:
          TABLE_NAME: !Ref InvocationsTable
          INIT_DELAY_MS: "800"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InvocationsTable
      FunctionUrlConfig:
        AuthType: NONE

  PredictorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: predictor/
      Handler: app.handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref InvocationsTable
          TARGET_FN: !Ref TargetFunction
          ALIAS: live
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InvocationsTable
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt TargetFunction.Arn
                - !Sub "${TargetFunction.Arn}:*"
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

Outputs:
  FunctionUrl:
    Value: !GetAtt TargetFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref InvocationsTable
  TargetFunctionName:
    Value: !Ref TargetFunction
  PredictorFunctionName:
    Value: !Ref PredictorFunction
